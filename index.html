["ห้องแห่งความลับ","ห้องแห่งความลับถูกเปิดอีกครั้ง นักเรียนถูกสาปให้กลายเป็นหิน แฮร์รี่ตามรอยสมุดบันทึกของทอม ริดเดิ้ล จนพบสัตว์ร้ายในห้องใต้ดิน",[["สัตว์ร้ายในห้องแห่งความลับคือตัวอะไร?","บาซิลิสก์","ฮิปโปกริฟ","มังกร"],["สมุดบันทึกเป็นของใคร?","ทอม ริดเดิ้ล","ซิเรียส แบล็ก","ลูเซียส มัลฟอย"],["เอลฟ์บ้านที่พยายามเตือนแฮร์รี่ชื่ออะไร?","ด็อบบี้","ครีเชอร์","วิงกี้"],["แฮร์รี่มีความสามารถพิเศษอะไรที่ทำให้ถูกสงสัย?","พูดภาษางู","มองเห็นอนาคต","ล่องหน"]]],

["เครื่องรางยมทูต 1","แฮร์รี่ รอน และเฮอร์ไมโอนี่ออกเดินทางตามหาฮอร์ครักซ์ โดยหนีการตามล่าของผู้เสพความตาย",[["ทั้งสามคนออกตามหาอะไร?","ฮอร์ครักซ์","ศิลาอาถรรพ์","ถ้วยทอง"],["ใครช่วยพวกเขาหนีจากคฤหาสน์มัลฟอย แล้วเสียชีวิต?","ด็อบบี้","วิงกี้","ครีเชอร์"],["ดัมเบิลดอร์ทิ้งอะไรไว้ให้รอน?","ไฟดับ","กระจกอีรีสเด","หมวกคัดสรร"],["เครื่องรางยมทูตมีกี่สิ่ง?","3","5","7"]]],

  '<div class="tabs"><button id="tl" class="'+(mode==="login"?"on":"")+'">🔑 เข้าสู่ระบบ</button><button id="tr" class="'+(mode==="reg"?"on":"")+'">✨ สมัครสมาชิก</button></div>'+
  '<input id="n" placeholder="ชื่อสมาชิก (ใช้ชื่อเล่นได้)" maxlength="20" autocomplete="off"><input id="p" type="password" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)">'+
  (mode==="reg"?'<input id="p2" type="password" placeholder="ยืนยันรหัสผ่านอีกครั้ง"><small style="display:block;text-align:center;color:#a9b0c0;margin:4px 0">💡 อย่าใช้รหัสผ่านเดียวกับที่อื่น และไม่ต้องใช้ชื่อจริง</small>':'')+
  '<div class="msg" id="m">'+(NET.bt?'⏳ กำลังตรวจสอบการเข้าสู่ระบบอัตโนมัติ...':'')+'</div><button class="green" id="go">🚪 '+(mode==="login"?"เข้าเกม":"สมัครและเข้าเกม")+'</button><button class="purple" id="pl">👥 รายชื่อผู้เล่นที่สมัครแล้ว</button>';
  $("tl").onclick=function(){mode="login";render()};$("tr").onclick=function(){mode="reg";render()};
  $("pl").onclick=function(){go("list")};
  $("go").onclick=function(){
    var nm=$("n").value.trim(),pw=$("p").value,k=nkey(nm),m=$("m");
    if(!nm){m.textContent="กรอกชื่อก่อน";return}
    if(pw.length<4){m.textContent="รหัสผ่านต้องมีอย่างน้อย 4 ตัว";return}
    if(mode==="reg"&&$("p2").value!==pw){m.textContent="รหัสผ่านทั้งสองช่องไม่ตรงกัน";return}
    var btn=$("go");btn.disabled=true;m.textContent="⏳ กำลังเชื่อมต่อเซิร์ฟเวอร์...";
    netLoad(function(ok){
      if(!ok){btn.disabled=false;localLogin(nm,pw,k,m);return}
      netAuth(nm,pw,k).then(function(r){
        btn.disabled=false;
        if(r.err){m.textContent=r.err;return}
        netEnter(k,r.obj,r.uid);afterLogin(k);save();go(next());netAfterEnter()})
    })
  };
}
function localLogin(nm,pw,k,m){
  if(mode==="reg"){
    if(DB.u[k]){m.textContent="ชื่อนี้มีคนใช้แล้ว";return}
    DB.u[k]={name:nm,pw:hash(pw),house:null,xp:0,gal:0,potion:0,own:FREE.slice(),av:null,best:{},wand:0,cloak:0};
  }else if(!DB.u[k]){m.textContent="เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ และยังไม่มีบัญชีนี้ในเครื่อง ลองใหม่เมื่อมีอินเทอร์เน็ต";return}
  else if(DB.u[k].pw!==hash(pw)){m.textContent="ชื่อหรือรหัสผ่านไม่ถูกต้อง";return}
  me=DB.u[k];NET.uid=null;afterLogin(k);save();go(next())}

  if(cur){

    $("sp").onclick=function(){cur.s=Math.min(3,cur.s+.25);save();rRoom()};
    $("rmv").onclick=function(){me.room=me.room.filter(function(r){return r!==cur});RSEL=null;save();rRoom()};
  }
  app.querySelectorAll(".di").forEach(function(el){
    var it=me.room.filter(function(r){return r.id===el.dataset.id})[0],drag=false,moved=false;
    el.onpointerdown=function(ev){ev.preventDefault();drag=true;moved=false;el.setPointerCapture(ev.pointerId);
      app.querySelectorAll(".di").forEach(function(x){x.classList.toggle("sel",x===el)})};
    el.onpointermove=function(ev){
      if(!drag)return;moved=true;
      var r=$("room").getBoundingClientRect();
      it.x=Math.round(Math.max(4,Math.min(96,(ev.clientX-r.left)/r.width*100))*10)/10;
      it.y=Math.round(Math.max(14,Math.min(96,(ev.clientY-r.top)/r.height*100))*10)/10;
      el.style.left=it.x+"%";el.style.top=it.y+"%";
    };
    el.onpointerup=function(){drag=false;save();if(RSEL!==it.id||!moved){RSEL=it.id;rRoom()}};
  });
}

var FREE=["🧙","🧙‍♀️","🧝","🧝‍♀️","🧛","🧚","🦸","🦹","🧑‍🎓","👦","👧","👨","👩","🧑‍🏫","🦉","🐱","🐸","🐀","🐉","🦄","🐍","🦁","🦡"];
var STORY=[
"<p>แฮร์รี่ พอตเตอร์เติบโตในห้องใต้บันไดของบ้านเดอร์สลีย์โดยไม่รู้ความจริงว่าพ่อแม่ของเขาถูกโวลเดอมอร์สังหาร จนวันเกิดอายุ 11 ปี แฮกริดมาพบและบอกว่าเขาเป็นพ่อมด</p><p>แฮกริดพาแฮร์รี่ไปซื้อของที่ตรอกไดแอกอน เขาได้ไม้กายสิทธิ์จากร้านออลลิแวนเดอร์ และได้นกฮูกหิมะชื่อเฮดวิก จากนั้นขึ้นรถไฟจากชานชาลา 9¾ ไปฮอกวอตส์ ได้เป็นเพื่อนกับรอนและเฮอร์ไมโอนี่ และหมวกคัดสรรส่งเขาเข้าบ้านกริฟฟินดอร์ โดยมีอัลบัส ดัมเบิลดอร์เป็นผู้อำนวยการโรงเรียน</p><p>แฮร์รี่เก่งการบินจนได้เป็นซีกเกอร์ของทีมควิดดิชกริฟฟินดอร์ ซึ่งต้องจับลูกสนิชสีทอง ตลอดปีเขาค้นพบว่ามีใครบางคนต้องการขโมยศิลาอาถรรพ์ที่ซ่อนไว้ในโรงเรียน ทั้งสามฝ่าด่านเฝ้าศิลา ทั้งสุนัขสามหัวชื่อฟลัฟฟี่ที่เฝ้าประตูกล ต้นไม้เถาพัน และหมากรุกยักษ์ ซึ่งรอนยอมเสียสละตัวเองในเกมเพื่อให้แฮร์รี่เดินต่อได้ ก่อนพบว่าศาสตราจารย์ควีเรลล์มีโวลเดอมอร์ซ่อนอยู่หลังศีรษะ</p>",
"<p>ปิดเทอมที่สอง ด็อบบี้เอลฟ์บ้านมาเตือนแฮร์รี่ไม่ให้กลับฮอกวอตส์ แต่รอนก็ขับรถฟอร์ดแองเกลียบินได้ของครอบครัววีสลีย์มารับเขาไป เมื่อกลับถึงโรงเรียน ข้อความเตือนเขียนด้วยเลือดบนกำแพงว่าห้องแห่งความลับถูกเปิดแล้ว โดยปีนี้กิลเดอรอย ล็อกฮาร์ตเป็นครูสอนศาสตร์ป้องกันศาสตร์มืด</p><p>นักเรียนเริ่มถูกสาปให้กลายเป็นหิน และแฮร์รี่ได้ยินเสียงลึกลับในกำแพงที่มีแต่เขาเท่านั้นเข้าใจ เพราะเขาพูดภาษางูได้ ทำให้หลายคนสงสัยว่าเป็นเขาเองที่เป็นทายาทของสลิธีริน การช่วยคนที่ถูกสาปให้ฟื้นต้องใช้ยาชุบชีวิตที่ทำจากแมนเดรก</p><p>เขาพบสมุดบันทึกของทอม ริดเดิ้ล ซึ่งพาเขาเข้าไปดูอดีต จนรู้ว่าสัตว์ร้ายคือบาซิลิสก์ และต้นเหตุคือจินนี่ วีสลีย์ที่ถูกสมุดบันทึกควบคุมให้เปิดห้องแห่งความลับ แฮร์รี่ลงไปห้องใต้ดิน ใช้ดาบกริฟฟินดอร์ที่ฟอว์กส์นกฟีนิกซ์ของดัมเบิลดอร์พามา สังหารบาซิลิสก์และช่วยจินนี่ไว้ได้</p>",
"<p>ซิเรียส แบล็กหนีออกจากคุกอัซคาบัน ทุกคนเชื่อว่าเขาเป็นสมุนของโวลเดอมอร์ที่จะตามล่าแฮร์รี่ ฮอกวอตส์จึงมีดีเมนเตอร์ ซึ่งเป็นผู้คุมวิญญาณของอัซคาบัน มาเฝ้าโรงเรียน ทำให้แฮร์รี่เป็นลมหมดสติเมื่อพวกมันเข้าใกล้</p><p>ศาสตราจารย์รีมัส ลูปินคนใหม่ ซึ่งสอนศาสตร์ป้องกันศาสตร์มืดในปีนี้ สอนให้แฮร์รี่ใช้คาถาเรียกผู้พิทักษ์ คือเอ็กเปคโต แพโทรนัม เฮอร์ไมโอนี่มีเครื่องย้อนเวลาเรียกว่าไทม์เทิร์นเนอร์ที่ช่วยให้เรียนได้หลายวิชา และแฮร์รี่ได้แผนที่ตัวป่วนที่บอกว่าทุกคนอยู่ที่ไหนในปราสาท รวมทั้งได้ขี่บัคบีค ฮิปโปกริฟสัตว์ครึ่งนกครึ่งม้า</p><p>ความจริงเผยที่กระท่อมกรีดร้อง ซิเรียสเป็นพ่อทูนหัวของแฮร์รี่และเป็นผู้บริสุทธิ์ ลูปินเป็นมนุษย์หมาป่า และหนูสแกบเบอร์สของรอนคือปีเตอร์ เพ็ตติกรูที่แปลงร่างเป็นหนู ผู้ทรยศตัวจริง ซึ่งหนีไปได้ ก่อนที่แฮร์รี่กับเฮอร์ไมโอนี่จะย้อนเวลากลับไปช่วยซิเรียสและบัคบีคไว้</p>",
"<p>ปีนี้เริ่มด้วยการแข่งควิดดิชเวิลด์คัพ แต่จบด้วยเครื่องหมายมารบนท้องฟ้า จากนั้นฮอกวอตส์จัดการแข่งขันไตรภาคีพ่อมด มีนักเรียนจากโบซ์บาตงและเดิร์มสแตรงมาร่วม ครูมูดี้ตาเดียวคนใหม่ที่มาสอน แท้จริงแล้วคือบาร์ตี้ เคราช์ จูเนียร์ที่ปลอมตัวมา</p><p>จอกอัคนีเลือกนักแข่ง 3 คน รวมถึงวิกเตอร์ ครัมจากเดิร์มสแตรง แต่กลับพ่นชื่อแฮร์รี่ออกมาเป็นคนที่สี่ งานแรกคือเผชิญมังกร แฮร์รี่เจอมังกรฮังการีฮอร์นเทล จากนั้นลงไปกู้ตัวประกันใต้ทะเลสาบ และเข้าเขาวงกตหนามในภารกิจสุดท้าย เขากับเซดริก ดิกกอรีไปถึงถ้วยพร้อมกันและจับพร้อมกัน</p><p>ถ้วยนั้นเป็นพอร์ตคีย์ พาทั้งสองไปสุสาน ที่ปีเตอร์ เพ็ตติกรูสังหารเซดริกด้วยคำสาปสังหารคืออาวาดา เคดาฟรา แล้วใช้เลือดของแฮร์รี่ชุบชีวิตโวลเดอมอร์ให้กลับมามีร่างกาย แฮร์รี่หนีกลับมาได้และบอกความจริงให้ทุกคนฟัง</p>",
"<p>กระทรวงเวทมนตร์ปฏิเสธว่าโวลเดอมอร์กลับมา และส่งโดโลเรส อัมบริดจ์ผู้ตรวจการชุดชมพูมาควบคุมฮอกวอตส์ เธอออกกฎมากมาย ห้ามสอนคาถาที่ใช้ได้จริง และพยายามไล่ดัมเบิลดอร์ออกจากตำแหน่งผู้อำนวยการ</p><p>แฮร์รี่จึงรวมเพื่อนตั้งกองทัพดัมเบิลดอร์ โดยแฮร์รี่เป็นผู้ฝึกสอน ฝึกคาถากันอย่างลับ ๆ ในห้องต้องประสงค์ ขณะเดียวกัน ดัมเบิลดอร์ก็มีออร์เดอร์ออฟเดอะฟีนิกซ์ องค์กรลับที่ต่อต้านโวลเดอมอร์ และแฮร์รี่ฝันเห็นสิ่งที่โวลเดอมอร์มองเห็นผ่านความเชื่อมโยงในแผลเป็น</p><p>เมื่อเห็นภาพซิเรียสถูกจับ แฮร์รี่กับเพื่อน ๆ บินไปกระทรวงเพื่อช่วย ซึ่งปีนี้ทุกคนที่เคยเห็นความตายจะมองเห็นเธสทรัล สัตว์ปีกคล้ายม้าที่พาพวกเขาไป แต่พวกเขาถูกหลอก คำทำนายถูกเก็บไว้ที่แผนกปริศนา เกิดการต่อสู้กับผู้เสพความตายที่นั่น ซิเรียส แบล็กถูกเบลลาทริกซ์ เลสเตรนจ์สังหาร และดัมเบิลดอร์มาประลองกับโวลเดอมอร์ต่อหน้าคนทั้งกระทรวง จนทุกคนยอมรับว่าเขากลับมาจริง</p>",
"<p>โลกเวทมนตร์ตกอยู่ในความหวาดกลัว ดัมเบิลดอร์พาแฮร์รี่ไปดูความทรงจำในเพนซีฟ อ่างที่ใช้ดูความทรงจำ เพื่อเรียนรู้อดีตของทอม ริดเดิ้ล และรู้ว่าโวลเดอมอร์แบ่งวิญญาณใส่ฮอร์ครักซ์หลายชิ้นเพื่อให้ตัวเองอมตะ ฮอร์ครักซ์คือวัตถุเก็บชิ้นส่วนวิญญาณ</p><p>ปีนี้ศาสตราจารย์ฮอเรซ สลักฮอร์นเป็นครูสอนปรุงยาคนใหม่ แฮร์รี่ได้ตำราปรุงยาเก่าที่เขียนโน้ตไว้โดยเจ้าชายเลือดผสม ทำให้เก่งวิชาปรุงยาขึ้นมาก ภายหลังรู้ว่าเจ้าชายเลือดผสมคือเซเวอรัส สเนป แฮร์รี่เอาความทรงจำสำคัญมาจากสลักฮอร์น ซึ่งเผยว่าโวลเดอมอร์ทำฮอร์ครักซ์หลายชิ้น และสลักฮอร์นให้ยาโชคดีเป็นรางวัลแก่เขา ส่วนแฮร์รี่เองก็เป็นกัปตันทีมควิดดิชของกริฟฟินดอร์</p><p>ดัมเบิลดอร์พาแฮร์รี่ไปถ้ำเพื่อตามหาฮอร์ครักซ์ ได้ล็อกเก็ตมา แต่ดัมเบิลดอร์ต้องดื่มยาพิษจนอ่อนแรง เมื่อกลับมา ผู้เสพความตายเข้ามาในปราสาทผ่านตู้หายตัวที่ดราโก มัลฟอยซ่อมไว้ และสเนปเป็นคนสังหารดัมเบิลดอร์บนหอคอยดาราศาสตร์</p>",
"<p>หลังดัมเบิลดอร์จากไป กระทรวงถูกผู้เสพความตายยึดครอง แฮร์รี่ รอน และเฮอร์ไมโอนี่จึงตัดสินใจไม่กลับโรงเรียน แต่ออกเดินทางตามหาฮอร์ครักซ์ที่เหลือโดยหลบหนีการตามล่าไปเรื่อย ๆ ก่อนออกเดินทาง งานแต่งงานของบิลกับฟลอร์ถูกผู้เสพความตายโจมตี ดัมเบิลดอร์ทิ้งไฟดับไว้ให้รอน และทิ้งหนังสือนิทานบีเดิลนักกวีไว้ให้เฮอร์ไมโอนี่</p><p>พวกเขาแอบอยู่ในเต็นท์ โดยเฮอร์ไมโอนี่เก็บข้าวของทั้งหมดไว้ในกระเป๋าลูกปัดใบเล็ก เดินทางผ่านป่า และพักที่บ้านเลขที่ 12 กริมโมลด์เพลซซึ่งซิเรียสทิ้งไว้ให้แฮร์รี่ พบกับล็อกเก็ตฮอร์ครักซ์ที่ทำให้ทุกคนอารมณ์เสียจนรอนเดินหนีไปชั่วคราว ก่อนกลับมาและใช้ดาบกริฟฟินดอร์ทำลายล็อกเก็ตนั้น</p><p>เซนอฟิเลียส เลิฟกู๊ดเล่านิทานเครื่องรางยมทูต เครื่องรางยมทูตมีทั้งหมด 3 สิ่ง ที่อาจทำให้ผู้ถือเป็นเจ้าแห่งความตาย ทั้งไม้เอลเดอร์ ศิลาคืนชีพ และผ้าคลุมล่องหน ทั้งสามคนถูกจับไปที่คฤหาสน์มัลฟอย ด็อบบี้มาช่วยพวกเขาหนีไว้แต่เสียชีวิต</p>",
"<p>ฮอร์ครักซ์ที่เหลือซ่อนอยู่ในห้องนิรภัยของเบลลาทริกซ์ที่กริงกอตส์ ทั้งสามแอบเข้าไปด้วยน้ำยาแปลงร่าง ขโมยถ้วยฮัฟเฟิลพัฟฟ์ แล้วหนีออกมาบนหลังมังกร</p><p>จากนั้นพวกเขากลับไปฮอกวอตส์ ซึ่งครูและนักเรียนเตรียมสู้กับกองทัพโวลเดอมอร์ ทุกคนร่วมกันป้องกันปราสาท แฮร์รี่ได้เห็นความทรงจำของสเนป และรู้ว่าสเนปรักลิลลี่ พอตเตอร์ แม่ของเขามาตลอดชีวิตและปกป้องเขามาตลอด รวมถึงรู้ว่าตัวเขาเองเป็นฮอร์ครักซ์ที่โวลเดอมอร์ไม่ได้ตั้งใจสร้าง</p><p>แฮร์รี่เดินเข้าป่าไปให้โวลเดอมอร์สังหาร แต่ฟื้นกลับมาและต่อสู้อีกครั้ง เนวิลล์ดึงดาบกริฟฟินดอร์ออกจากหมวกคัดสรรและสังหารนาจินี ส่วนไม้เอลเดอร์ซึ่งเจ้าของที่แท้จริงคือแฮร์รี่ ในที่สุดแฮร์รี่ใช้คาถาเอ็กเปลลิอาร์มัสสู้กับโวลเดอมอร์และเอาชนะได้ ฉากสุดท้ายข้ามไป 19 ปี ที่สถานีคิงส์ครอส ชานชาลา 9¾ เมื่อลูก ๆ ของพวกเขาขึ้นรถไฟไปฮอกวอตส์</p>"

STORY.push(
"<p>ฮอกวอตส์ก่อตั้งโดยพ่อมดแม่มดผู้ยิ่งใหญ่สี่คน คือกอดริก กริฟฟินดอร์ ซาลาซาร์ สลิธีริน เฮลก้า ฮัฟเฟิลพัฟ และโรวีนา เรเวนคลอ ซึ่งเป็นที่มาของบ้านทั้งสี่ สัญลักษณ์ของแต่ละบ้านคือสิงโต งู แบดเจอร์ และนกอินทรี ตามลำดับ บ้านกริฟฟินดอร์ใช้สีแดงกับทอง บ้านสลิธีรินใช้สีเขียวกับเงิน ฮัฟเฟิลพัฟใช้สีเหลืองกับดำ และเรเวนคลอใช้สีน้ำเงินกับบรอนซ์</p><p>หมวกคัดสรรเป็นผู้ตัดสินว่านักเรียนใหม่จะเข้าบ้านไหน และเคยเป็นของกอดริก กริฟฟินดอร์ บ้านแต่ละบ้านมีหัวหน้าบ้านคอยดูแล หัวหน้าบ้านกริฟฟินดอร์คือมิเนอร์ว่า แมคกอนนากัล หัวหน้าบ้านสลิธีรินคือเซเวอรัส สเนป หัวหน้าบ้านฮัฟเฟิลพัฟคือโพโมนา สเปราท์ และหัวหน้าบ้านเรเวนคลอคือฟิลิอัส ฟลิตวิก</p><p>บ้านทั้งสี่มีผีประจำบ้านด้วย ผีประจำกริฟฟินดอร์คือเกือบไร้หัวนิค ผีประจำสลิธีรินคือบารอนเลือด ผีประจำฮัฟเฟิลพัฟคือพระอ้วน และผีประจำเรเวนคลอคือสตรีสีเทา ซึ่งเป็นลูกสาวของโรวีนา เรเวนคลอ นักเรียนแต่ละบ้านแข่งกันสะสมคะแนนบ้านตลอดทั้งปี บ้านที่ชนะจะได้ถ้วยบ้าน</p>",
"<p>โลกเวทมนตร์มีสัตว์วิเศษมากมาย ฮิปโปกริฟเป็นสัตว์ครึ่งนกอินทรีครึ่งม้า ภูมิใจและโกรธง่าย ต้องโค้งคำนับก่อนเข้าใกล้ บัคบีคคือฮิปโปกริฟที่แฮร์รี่ได้ขี่ เธสทรัลเป็นสัตว์ปีกคล้ายม้าผอมสีดำ ที่มองเห็นได้เฉพาะคนที่เคยเห็นความตาย ฟีนิกซ์ชื่อฟอว์กส์ของดัมเบิลดอร์ร้องเพลงให้กำลังใจ และน้ำตาของมันรักษาบาดแผลได้ ส่วนแมนเดรกเป็นพืชที่เสียงร้องของมันทำให้ผู้ฟังสลบหรือตายได้ ต้นอ่อนจะทำให้สลบ จึงต้องใส่ที่อุดหู</p><p>วิชาที่ฮอกวอตส์มีหลายวิชา ศาสตราจารย์ฟลิตวิกสอนวิชาคาถา ศาสตราจารย์สเนปสอนวิชาปรุงยา ศาสตราจารย์สเปราท์สอนวิชาสมุนไพรศาสตร์ ศาสตราจารย์แมคกอนนากัลสอนวิชาแปลงร่าง ศาสตราจารย์ทรีลอว์นีสอนวิชาทำนาย และมาดามฮูชสอนวิชาบินและเป็นกรรมการควิดดิช</p><p>นักเรียนเอาสัตว์เลี้ยงมาโรงเรียนได้ เช่นนกฮูก แมว และคางคก เฮอร์ไมโอนี่เลี้ยงแมวชื่อครุกแชงค์ รอนเลี้ยงหนูชื่อสแกบเบอร์ส และแฮร์รี่เลี้ยงนกฮูกชื่อเฮดวิก นิวท์ สคามันเดอร์ เป็นนักสัตววิทยาเวทมนตร์ ผู้เขียนหนังสือสัตว์มหัศจรรย์และถิ่นที่อยู่ เขาเก็บสัตว์วิเศษไว้ในกระเป๋าเดินทาง มีนิฟเลอร์ตัวที่ชอบขโมยของแวววาวอยู่ด้วย</p>",
"<p>ควิดดิชเป็นกีฬาที่เล่นบนไม้กวาด แต่ละทีมมีผู้เล่น 7 คน ได้แก่เชสเซอร์ 3 คน บีตเตอร์ 2 คน คีปเปอร์ 1 คน และซีกเกอร์ 1 คน มีลูกบอล 4 ลูก คือลูกควัฟเฟิลสีแดงที่เชสเซอร์ใช้ยิงเข้าห่วง ได้ 10 คะแนนต่อประตู ลูกบลัดเจอร์สีดำ 2 ลูกที่บีตเตอร์ใช้ตีป่วนฝ่ายตรงข้าม และลูกสนิชสีทองที่ซีกเกอร์ต้องจับ ซึ่งได้ 150 คะแนนและจบเกมทันที</p><p>ไม้กวาดที่มีชื่อเสียงมีหลายรุ่น แฮร์รี่ได้นิมบัส 2000 ตอนปีแรก และได้ไฟร์โบลต์จากซิเรียสในปีที่สาม ควิดดิชเวิลด์คัพที่แฮร์รี่ไปดูเป็นการแข่งระหว่างไอร์แลนด์กับบัลแกเรีย วิกเตอร์ ครัมเป็นซีกเกอร์ของบัลแกเรีย แต่ไอร์แลนด์เป็นผู้ชนะ</p><p>ของวิเศษอื่น ๆ ก็สำคัญ แผนที่ตัวป่วนเป็นของที่เฟรดกับจอร์จมอบให้แฮร์รี่ ไทม์เทิร์นเนอร์เป็นของเฮอร์ไมโอนี่ ผ้าคลุมล่องหนแฮร์รี่ได้จากดัมเบิลดอร์ ส่วนกระจกอีรีสเดแสดงสิ่งที่ผู้ส่องปรารถนาที่สุด แฮร์รี่เห็นพ่อแม่ของเขาในกระจกนั้น</p>",
"<p>โวลเดอมอร์แบ่งวิญญาณของตนไปใส่ในฮอร์ครักซ์หลายชิ้น วัตถุที่เป็นฮอร์ครักซ์ได้แก่สมุดบันทึกของทอม ริดเดิ้ล แหวนของตระกูลกอนต์ ล็อกเก็ตของสลิธีริน ถ้วยของเฮลก้า ฮัฟเฟิลพัฟ มงกุฎของโรวีนา เรเวนคลอ และงูนาจินีซึ่งเป็นสัตว์มีชีวิต แฮร์รี่ทำลายสมุดบันทึกด้วยเขี้ยวบาซิลิสก์ ส่วนเฮอร์ไมโอนี่ทำลายถ้วยด้วยเขี้ยวบาซิลิสก์ และมงกุฎถูกทำลายด้วยไฟปีศาจในห้องต้องประสงค์</p><p>ดัมเบิลดอร์ทำลายแหวนของตระกูลกอนต์ แต่ได้รับคำสาปที่มือ ในแหวนนั้นมีศิลาคืนชีพซึ่งเป็นหนึ่งในเครื่องรางยมทูต ดัมเบิลดอร์จึงซ่อนศิลาไว้ในลูกสนิชที่ยกให้แฮร์รี่ เครื่องรางยมทูตมาจากนิทานสามพี่น้อง ซึ่งเล่าถึงไม้เอลเดอร์ ศิลาคืนชีพ และผ้าคลุมล่องหน โดยผ้าคลุมล่องหนเป็นของพี่น้องคนสุดท้อง ซึ่งแฮร์รี่สืบทอดมา</p><p>ก่อนเข้าป่าไปพบโวลเดอมอร์ แฮร์รี่ใช้ศิลาคืนชีพเรียกพ่อแม่ ซิเรียส และลูปินมาเดินเป็นเพื่อน ทุกคนให้กำลังใจเขาจนเดินต่อไปได้ นี่คือบทสรุปที่เชื่อมไปสู่ศึกสุดท้ายที่ฮอกวอตส์</p>"
);

var UN;

function newU(){

  d=shuffle(d);

function udraw(h,n){

    if(!UN.deck.length){var t=UN.disc.pop();UN.deck=shuffle(UN.disc);UN.disc=[t]}

function ucan(c){return c.c==="W"||c.c===UN.col||c.v===UN.top.v}
function udo(who,idx,col){
  var hand=who==="p"?UN.hand:UN.bot,oth=who==="p"?UN.bot:UN.hand,otherId=who==="p"?"b":"p";
  var c=hand.splice(idx,1)[0],again=false;

  var nm=who==="p"?"คุณ":"บอท";
  UN.msg=nm+"ลง "+c.v+(c.c==="W"?" เลือกสี"+CN[col]:"");
  if(c.v==="+2"){udraw(oth,2);again=true;UN.msg+=" อีกฝ่ายจั่ว 2 ใบและโดนข้าม"}
  else if(c.v==="+4"){udraw(oth,4);again=true;UN.msg+=" อีกฝ่ายจั่ว 4 ใบและโดนข้าม"}
  else if(c.v==="⛔"||c.v==="🔄"){again=true;UN.msg+=" อีกฝ่ายโดนข้าม"}

    UN.over=who;
    if(who==="p"){me.xp+=40;me.gal+=30;me.uno=(me.uno||0)+1;moAdd("uno",1);save()}

function ubot(){

  if(i<0)i=w;

    udraw(UN.bot,1);var c=UN.bot[UN.bot.length-1];
    if(c&&ucan(c))i=UN.bot.length-1;

  }

function updraw(){

var g24;
function solve(a){
  if(a.length===1)return Math.abs(a[0][0]-24)<1e-6?a[0][1]:null;
  for(var i=0;i<a.length;i++)for(var j=i+1;j<a.length;j++){
    var x=a[i],y=a[j],rest=a.filter(function(_,k){return k!==i&&k!==j});
    var c=[[x[0]+y[0],"("+x[1]+"+"+y[1]+")"],[x[0]*y[0],"("+x[1]+"×"+y[1]+")"],[x[0]-y[0],"("+x[1]+"−"+y[1]+")"],[y[0]-x[0],"("+y[1]+"−"+x[1]+")"]];
    if(y[0]!==0)c.push([x[0]/y[0],"("+x[1]+"÷"+y[1]+")"]);
    if(x[0]!==0)c.push([y[0]/x[0],"("+y[1]+"÷"+x[1]+")"]);
    for(var k=0;k<c.length;k++){var r=solve(rest.concat([c[k]]));if(r)return r}
  }
  return null;
}
function calc(T){
  var p=0;
  function expr(){var v=term();while(T[p]==="+"||T[p]==="-"){var o=T[p++],r=term();v=o==="+"?v+r:v-r}return v}
  function term(){var v=fac();while(T[p]==="*"||T[p]==="/"){var o=T[p++],r=fac();v=o==="*"?v*r:v/r}return v}
  function fac(){
    if(T[p]==="("){p++;var v=expr();if(T[p]!==")")throw 0;p++;return v}
    if(!/^\d+$/.test(T[p]||""))throw 0;return +T[p++]}
  var v=expr();if(p!==T.length)throw 0;return v;
}
function newG(){
  var n;do{n=[0,0,0,0].map(function(){return 1+Math.floor(Math.random()*9)})}while(!solve(n.map(function(x){return[x,String(x)]})));
  g24={n:n,u:[false,false,false,false],E:[],hint:false,won:false};
}

var RAR=[["สามัญ","⚪",60],["หายาก","🔵",25],["มหากาพย์","🟣",12],["ตำนาน","🟡",3]];
var WANDS=[["ไม้โอ๊ค แกนขนยูนิคอร์น",0],["ไม้เบิร์ช แกนเส้นเอ็นมังกร",0],["ไม้สน แกนขนยูนิคอร์น",0],["ไม้วอลนัท แกนขนฟีนิกซ์",0],["ไม้เฮเซล แกนขนยูนิคอร์น",1],["ไม้แอช แกนเส้นเอ็นมังกร",1],["ไม้เมเปิล แกนขนฟีนิกซ์",1],["ไม้ฮอลลี่ แกนขนฟีนิกซ์",2],["ไม้เยว แกนขนฟีนิกซ์",2],["ไม้เถาองุ่น แกนเส้นเอ็นมังกร",2],["ไม้เอลเดอร์ (ไม้ยมทูต)",3]];
function roll(){
  var r=Math.random()*100,t=0,k=0;
  for(var i=0;i<RAR.length;i++){t+=RAR[i][2];if(r<t){k=i;break}}

  return pool[Math.floor(Math.random()*pool.length)];
}
function spin(n,cost){

  for(var i=0;i<n;i++){var w=roll();me.wands[w[0]]=(me.wands[w[0]]||0)+1;res.push(w)}
  save();rGacha(res);
}
