  '<div class="tabs"><button id="tl" class="'+(mode==="login"?"on":"")+'">🔑 เข้าสู่ระบบ</button><button id="tr" class="'+(mode==="reg"?"on":"")+'">✨ สมัครสมาชิก</button></div>'+
  '<input id="n" placeholder="ชื่อสมาชิก (ใช้ชื่อเล่นได้)" maxlength="20" autocomplete="off"><input id="p" type="password" placeholder="รหัสผ่าน (อย่างน้อย 4 ตัว)">'+
  (mode==="reg"?'<input id="p2" type="password" placeholder="ยืนยันรหัสผ่านอีกครั้ง"><small style="display:block;text-align:center;color:#a9b0c0;margin:4px 0">💡 อย่าใช้รหัสผ่านเดียวกับที่อื่น และไม่ต้องใช้ชื่อจริง</small>':'')+
  '<div class="msg" id="m">'+(NET.bt?'⏳ กำลังตรวจสอบการเข้าสู่ระบบอัตโนมัติ...':'')+'</div><button class="green" id="go">🚪 '+(mode==="login"?"เข้าเกม":"สมัครและเข้าเกม")+'</button><button class="purple" id="pl">👥 รายชื่อผู้เล่นที่สมัครแล้ว</button>';
  $("tl").onclick=function(){mode="login";render()};$("tr").onclick=function(){mode="reg";render()};
  $("pl").onclick=function(){go("list")};
  $("go").onclick=function(){
    var nm=$("n").value.trim(),pw=$("p").value,k=nkey(nm),m=$("m");
    if(!nm){m.textContent="กรอกชื่อก่อน";return}
    if(pw.length<4){m.textContent="รหัสผ่านต้องมีอย่างน้อย 4 ตัว";return}
    if(mode==="reg"&&$("p2").value!==pw){m.textContent="รหัสผ่านทั้งสองช่องไม่ตรงกัน";return}
    var btn=$("go");btn.disabled=true;m.textContent="⏳ กำลังเชื่อมต่อเซิร์ฟเวอร์...";
    netLoad(function(ok){
      if(!ok){btn.disabled=false;localLogin(nm,pw,k,m);return}
      netAuth(nm,pw,k).then(function(r){
        btn.disabled=false;
        if(r.err){m.textContent=r.err;return}
        netEnter(k,r.obj,r.uid);afterLogin(k);save();go(next());netAfterEnter()})
    })
  };
}
function localLogin(nm,pw,k,m){
  if(mode==="reg"){
    if(DB.u[k]){m.textContent="ชื่อนี้มีคนใช้แล้ว";return}
    DB.u[k]={name:nm,pw:hash(pw),house:null,xp:0,gal:0,potion:0,own:FREE.slice(),av:null,best:{},wand:0,cloak:0};
  }else if(!DB.u[k]){m.textContent="เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ และยังไม่มีบัญชีนี้ในเครื่อง ลองใหม่เมื่อมีอินเทอร์เน็ต";return}
  else if(DB.u[k].pw!==hash(pw)){m.textContent="ชื่อหรือรหัสผ่านไม่ถูกต้อง";return}
  me=DB.u[k];NET.uid=null;afterLogin(k);save();go(next())}

    $("sp").onclick=function(){cur.s=Math.min(3,cur.s+.25);save();rRoom()};
    $("rmv").onclick=function(){me.room=me.room.filter(function(r){return r!==cur});RSEL=null;save();rRoom()};
  }
  app.querySelectorAll(".di").forEach(function(el){
    var it=me.room.filter(function(r){return r.id===el.dataset.id})[0],drag=false,moved=false;
    el.onpointerdown=function(ev){ev.preventDefault();drag=true;moved=false;el.setPointerCapture(ev.pointerId);
      app.querySelectorAll(".di").forEach(function(x){x.classList.toggle("sel",x===el)})};
    el.onpointermove=function(ev){
      if(!drag)return;moved=true;
      var r=$("room").getBoundingClientRect();
      it.x=Math.round(Math.max(4,Math.min(96,(ev.clientX-r.left)/r.width*100))*10)/10;
      it.y=Math.round(Math.max(14,Math.min(96,(ev.clientY-r.top)/r.height*100))*10)/10;
      el.style.left=it.x+"%";el.style.top=it.y+"%";
    };
    el.onpointerup=function(){drag=false;save();if(RSEL!==it.id||!moved){RSEL=it.id;rRoom()}};
  });
}

var FREE=["🧙","🧙‍♀️","🧝","🧝‍♀️","🧛","🧚","🦸","🦹","🧑‍🎓","👦","👧","👨","👩","🧑‍🏫","🦉","🐱","🐸","🐀","🐉","🦄","🐍","🦁","🦡"];
var STORY=[
"<p>แฮร์รี่ พอตเตอร์เติบโตในห้องใต้บันไดของบ้านเดอร์สลีย์โดยไม่รู้ความจริงว่าพ่อแม่ของเขาถูกโวลเดอมอร์สังหาร จนวันเกิดอายุ 11 ปี แฮกริดมาพบและบอกว่าเขาเป็นพ่อมด</p><p>แฮกริดพาแฮร์รี่ไปซื้อของที่ตรอกไดแอกอน เขาได้ไม้กายสิทธิ์จากร้านออลลิแวนเดอร์ และได้นกฮูกหิมะชื่อเฮดวิก จากนั้นขึ้นรถไฟจากชานชาลา 9¾ ไปฮอกวอตส์ ได้เป็นเพื่อนกับรอนและเฮอร์ไมโอนี่ และหมวกคัดสรรส่งเขาเข้าบ้านกริฟฟินดอร์ โดยมีอัลบัส ดัมเบิลดอร์เป็นผู้อำนวยการโรงเรียน</p><p>แฮร์รี่เก่งการบินจนได้เป็นซีกเกอร์ของทีมควิดดิชกริฟฟินดอร์ ซึ่งต้องจับลูกสนิชสีทอง ตลอดปีเขาค้นพบว่ามีใครบางคนต้องการขโมยศิลาอาถรรพ์ที่ซ่อนไว้ในโรงเรียน ทั้งสามฝ่าด่านเฝ้าศิลา ทั้งสุนัขสามหัวชื่อฟลัฟฟี่ที่เฝ้าประตูกล ต้นไม้เถาพัน และหมากรุกยักษ์ ซึ่งรอนยอมเสียสละตัวเองในเกมเพื่อให้แฮร์รี่เดินต่อได้ ก่อนพบว่าศาสตราจารย์ควีเรลล์มีโวลเดอมอร์ซ่อนอยู่หลังศีรษะ</p>",
"<p>ปิดเทอมที่สอง ด็อบบี้เอลฟ์บ้านมาเตือนแฮร์รี่ไม่ให้กลับฮอกวอตส์ แต่รอนก็ขับรถฟอร์ดแองเกลียบินได้ของครอบครัววีสลีย์มารับเขาไป เมื่อกลับถึงโรงเรียน ข้อความเตือนเขียนด้วยเลือดบนกำแพงว่าห้องแห่งความลับถูกเปิดแล้ว โดยปีนี้กิลเดอรอย ล็อกฮาร์ตเป็นครูสอนศาสตร์ป้องกันศาสตร์มืด</p><p>นักเรียนเริ่มถูกสาปให้กลายเป็นหิน และแฮร์รี่ได้ยินเสียงลึกลับในกำแพงที่มีแต่เขาเท่านั้นเข้าใจ เพราะเขาพูดภาษางูได้ ทำให้หลายคนสงสัยว่าเป็นเขาเองที่เป็นทายาทของสลิธีริน การช่วยคนที่ถูกสาปให้ฟื้นต้องใช้ยาชุบชีวิตที่ทำจากแมนเดรก</p><p>เขาพบสมุดบันทึกของทอม ริดเดิ้ล ซึ่งพาเขาเข้าไปดูอดีต จนรู้ว่าสัตว์ร้ายคือบาซิลิสก์ และต้นเหตุคือจินนี่ วีสลีย์ที่ถูกสมุดบันทึกควบคุมให้เปิดห้องแห่งความลับ แฮร์รี่ลงไปห้องใต้ดิน ใช้ดาบกริฟฟินดอร์ที่ฟอว์กส์นกฟีนิกซ์ของดัมเบิลดอร์พามา สังหารบาซิลิสก์และช่วยจินนี่ไว้ได้</p>",
"<p>ซิเรียส แบล็กหนีออกจากคุกอัซคาบัน ทุกคนเชื่อว่าเขาเป็นสมุนของโวลเดอมอร์ที่จะตามล่าแฮร์รี่ ฮอกวอตส์จึงมีดีเมนเตอร์ ซึ่งเป็นผู้คุมวิญญาณของอัซคาบัน มาเฝ้าโรงเรียน ทำให้แฮร์รี่เป็นลมหมดสติเมื่อพวกมันเข้าใกล้</p><p>ศาสตราจารย์รีมัส ลูปินคนใหม่ ซึ่งสอนศาสตร์ป้องกันศาสตร์มืดในปีนี้ สอนให้แฮร์รี่ใช้คาถาเรียกผู้พิทักษ์ คือเอ็กเปคโต แพโทรนัม เฮอร์ไมโอนี่มีเครื่องย้อนเวลาเรียกว่าไทม์เทิร์นเนอร์ที่ช่วยให้เรียนได้หลายวิชา และแฮร์รี่ได้แผนที่ตัวป่วนที่บอกว่าทุกคนอยู่ที่ไหนในปราสาท รวมทั้งได้ขี่บัคบีค ฮิปโปกริฟสัตว์ครึ่งนกครึ่งม้า</p><p>ความจริงเผยที่กระท่อมกรีดร้อง ซิเรียสเป็นพ่อทูนหัวของแฮร์รี่และเป็นผู้บริสุทธิ์ ลูปินเป็นมนุษย์หมาป่า และหนูสแกบเบอร์สของรอนคือปีเตอร์ เพ็ตติกรูที่แปลงร่างเป็นหนู ผู้ทรยศตัวจริง ซึ่งหนีไปได้ ก่อนที่แฮร์รี่กับเฮอร์ไมโอนี่จะย้อนเวลากลับไปช่วยซิเรียสและบัคบีคไว้</p>",
"<p>ปีนี้เริ่มด้วยการแข่งควิดดิชเวิลด์คัพ แต่จบด้วยเครื่องหมายมารบนท้องฟ้า จากนั้นฮอกวอตส์จัดการแข่งขันไตรภาคีพ่อมด มีนักเรียนจากโบซ์บาตงและเดิร์มสแตรงมาร่วม ครูมูดี้ตาเดียวคนใหม่ที่มาสอน แท้จริงแล้วคือบาร์ตี้ เคราช์ จูเนียร์ที่ปลอมตัวมา</p><p>จอกอัคนีเลือกนักแข่ง 3 คน รวมถึงวิกเตอร์ ครัมจากเดิร์มสแตรง แต่กลับพ่นชื่อแฮร์รี่ออกมาเป็นคนที่สี่ งานแรกคือเผชิญมังกร แฮร์รี่เจอมังกรฮังการีฮอร์นเทล จากนั้นลงไปกู้ตัวประกันใต้ทะเลสาบ และเข้าเขาวงกตหนามในภารกิจสุดท้าย เขากับเซดริก ดิกกอรีไปถึงถ้วยพร้อมกันและจับพร้อมกัน</p><p>ถ้วยนั้นเป็นพอร์ตคีย์ พาทั้งสองไปสุสาน ที่ปีเตอร์ เพ็ตติกรูสังหารเซดริกด้วยคำสาปสังหารคืออาวาดา เคดาฟรา แล้วใช้เลือดของแฮร์รี่ชุบชีวิตโวลเดอมอร์ให้กลับมามีร่างกาย แฮร์รี่หนีกลับมาได้และบอกความจริงให้ทุกคนฟัง</p>",
"<p>กระทรวงเวทมนตร์ปฏิเสธว่าโวลเดอมอร์กลับมา และส่งโดโลเรส อัมบริดจ์ผู้ตรวจการชุดชมพูมาควบคุมฮอกวอตส์ เธอออกกฎมากมาย ห้ามสอนคาถาที่ใช้ได้จริง และพยายามไล่ดัมเบิลดอร์ออกจากตำแหน่งผู้อำนวยการ</p><p>แฮร์รี่จึงรวมเพื่อนตั้งกองทัพดัมเบิลดอร์ โดยแฮร์รี่เป็นผู้ฝึกสอน ฝึกคาถากันอย่างลับ ๆ ในห้องต้องประสงค์ ขณะเดียวกัน ดัมเบิลดอร์ก็มีออร์เดอร์ออฟเดอะฟีนิกซ์ องค์กรลับที่ต่อต้านโวลเดอมอร์ และแฮร์รี่ฝันเห็นสิ่งที่โวลเดอมอร์มองเห็นผ่านความเชื่อมโยงในแผลเป็น</p><p>เมื่อเห็นภาพซิเรียสถูกจับ แฮร์รี่กับเพื่อน ๆ บินไปกระทรวงเพื่อช่วย ซึ่งปีนี้ทุกคนที่เคยเห็นความตายจะมองเห็นเธสทรัล สัตว์ปีกคล้ายม้าที่พาพวกเขาไป แต่พวกเขาถูกหลอก คำทำนายถูกเก็บไว้ที่แผนกปริศนา เกิดการต่อสู้กับผู้เสพความตายที่นั่น ซิเรียส แบล็กถูกเบลลาทริกซ์ เลสเตรนจ์สังหาร และดัมเบิลดอร์มาประลองกับโวลเดอมอร์ต่อหน้าคนทั้งกระทรวง จนทุกคนยอมรับว่าเขากลับมาจริง</p>",
"<p>โลกเวทมนตร์ตกอยู่ในความหวาดกลัว ดัมเบิลดอร์พาแฮร์รี่ไปดูความทรงจำในเพนซีฟ อ่างที่ใช้ดูความทรงจำ เพื่อเรียนรู้อดีตของทอม ริดเดิ้ล และรู้ว่าโวลเดอมอร์แบ่งวิญญาณใส่ฮอร์ครักซ์หลายชิ้นเพื่อให้ตัวเองอมตะ ฮอร์ครักซ์คือวัตถุเก็บชิ้นส่วนวิญญาณ</p><p>ปีนี้ศาสตราจารย์ฮอเรซ สลักฮอร์นเป็นครูสอนปรุงยาคนใหม่ แฮร์รี่ได้ตำราปรุงยาเก่าที่เขียนโน้ตไว้โดยเจ้าชายเลือดผสม ทำให้เก่งวิชาปรุงยาขึ้นมาก ภายหลังรู้ว่าเจ้าชายเลือดผสมคือเซเวอรัส สเนป แฮร์รี่เอาความทรงจำสำคัญมาจากสลักฮอร์น ซึ่งเผยว่าโวลเดอมอร์ทำฮอร์ครักซ์หลายชิ้น และสลักฮอร์นให้ยาโชคดีเป็นรางวัลแก่เขา ส่วนแฮร์รี่เองก็เป็นกัปตันทีมควิดดิชของกริฟฟินดอร์</p><p>ดัมเบิลดอร์พาแฮร์รี่ไปถ้ำเพื่อตามหาฮอร์ครักซ์ ได้ล็อกเก็ตมา แต่ดัมเบิลดอร์ต้องดื่มยาพิษจนอ่อนแรง เมื่อกลับมา ผู้เสพความตายเข้ามาในปราสาทผ่านตู้หายตัวที่ดราโก มัลฟอยซ่อมไว้ และสเนปเป็นคนสังหารดัมเบิลดอร์บนหอคอยดาราศาสตร์</p>",
"<p>หลังดัมเบิลดอร์จากไป กระทรวงถูกผู้เสพความตายยึดครอง แฮร์รี่ รอน และเฮอร์ไมโอนี่จึงตัดสินใจไม่กลับโรงเรียน แต่ออกเดินทางตามหาฮอร์ครักซ์ที่เหลือโดยหลบหนีการตามล่าไปเรื่อย ๆ ก่อนออกเดินทาง งานแต่งงานของบิลกับฟลอร์ถูกผู้เสพความตายโจมตี ดัมเบิลดอร์ทิ้งไฟดับไว้ให้รอน และทิ้งหนังสือนิทานบีเดิลนักกวีไว้ให้เฮอร์ไมโอนี่</p><p>พวกเขาแอบอยู่ในเต็นท์ โดยเฮอร์ไมโอนี่เก็บข้าวของทั้งหมดไว้ในกระเป๋าลูกปัดใบเล็ก เดินทางผ่านป่า และพักที่บ้านเลขที่ 12 กริมโมลด์เพลซซึ่งซิเรียสทิ้งไว้ให้แฮร์รี่ พบกับล็อกเก็ตฮอร์ครักซ์ที่ทำให้ทุกคนอารมณ์เสียจนรอนเดินหนีไปชั่วคราว ก่อนกลับมาและใช้ดาบกริฟฟินดอร์ทำลายล็อกเก็ตนั้น</p><p>เซนอฟิเลียส เลิฟกู๊ดเล่านิทานเครื่องรางยมทูต เครื่องรางยมทูตมีทั้งหมด 3 สิ่ง ที่อาจทำให้ผู้ถือเป็นเจ้าแห่งความตาย ทั้งไม้เอลเดอร์ ศิลาคืนชีพ และผ้าคลุมล่องหน ทั้งสามคนถูกจับไปที่คฤหาสน์มัลฟอย ด็อบบี้มาช่วยพวกเขาหนีไว้แต่เสียชีวิต</p>",
"<p>ฮอร์ครักซ์ที่เหลือซ่อนอยู่ในห้องนิรภัยของเบลลาทริกซ์ที่กริงกอตส์ ทั้งสามแอบเข้าไปด้วยน้ำยาแปลงร่าง ขโมยถ้วยฮัฟเฟิลพัฟฟ์ แล้วหนีออกมาบนหลังมังกร</p><p>จากนั้นพวกเขากลับไปฮอกวอตส์ ซึ่งครูและนักเรียนเตรียมสู้กับกองทัพโวลเดอมอร์ ทุกคนร่วมกันป้องกันปราสาท แฮร์รี่ได้เห็นความทรงจำของสเนป และรู้ว่าสเนปรักลิลลี่ พอตเตอร์ แม่ของเขามาตลอดชีวิตและปกป้องเขามาตลอด รวมถึงรู้ว่าตัวเขาเองเป็นฮอร์ครักซ์ที่โวลเดอมอร์ไม่ได้ตั้งใจสร้าง</p><p>แฮร์รี่เดินเข้าป่าไปให้โวลเดอมอร์สังหาร แต่ฟื้นกลับมาและต่อสู้อีกครั้ง เนวิลล์ดึงดาบกริฟฟินดอร์ออกจากหมวกคัดสรรและสังหารนาจินี ส่วนไม้เอลเดอร์ซึ่งเจ้าของที่แท้จริงคือแฮร์รี่ ในที่สุดแฮร์รี่ใช้คาถาเอ็กเปลลิอาร์มัสสู้กับโวลเดอมอร์และเอาชนะได้ ฉากสุดท้ายข้ามไป 19 ปี ที่สถานีคิงส์ครอส ชานชาลา 9¾ เมื่อลูก ๆ ของพวกเขาขึ้นรถไฟไปฮอกวอตส์</p>"
];

["ทีมงานพลาดเดดไลน์ คุณมักเป็นคนที่...",[["ออกมารับหน้าและเสนอทางออก","G"],["จัดลำดับงานใหม่และสั่งการ","S"],["วิเคราะห์ว่าพลาดตรงไหน","R"],["ช่วยทุกคนจนงานเสร็จ","H"]]],
["สถานที่ในปราสาทที่อยากอยู่?",[["สนามควิดดิช","G"],["ห้องใต้ดินเงียบ ๆ","S"],["ห้องสมุด","R"],["ห้องครัวอบอุ่น","H"]]],

var HD={G:"กล้าหาญ ตรงไปตรงมา และไม่ทิ้งเพื่อน",S:"มีเป้าหมายชัด ฉลาดวางแผน และรู้ว่าต้องการอะไร",R:"ใฝ่รู้ ช่างคิด และรักการเรียนรู้",H:"ซื่อสัตย์ ใจดี และทำงานหนักอย่างเงียบ ๆ"};
var SS,sel;
function next(){SS=null;return !me.av?"pick":!me.house?"sort":"hub"}
function rPick(){
  var h='<h1>เลือกตัวละครของคุณ</h1><p style="text-align:center;color:#a9b0c0">แตะเพื่อเลือก เปลี่ยนทีหลังได้ในหน้าหลัก</p><div class="chars">';
  FREE.forEach(function(c){h+='<button class="ch'+(c===sel?" on":"")+'" data-c="'+c+'">'+c+'</button>'});
  app.innerHTML=h+'</div><button class="green" id="ok"'+(sel?"":" disabled")+'>ยืนยันตัวละคร</button>';
  app.querySelectorAll("[data-c]").forEach(function(b){b.onclick=function(){sel=b.dataset.c;rPick()}});
  $("ok").onclick=function(){if(!sel)return;me.av=sel;sel=null;save();go(next())};
}
function rSort(){
  if(!SS)SS={i:0,sc:{G:0,S:0,R:0,H:0}};
  if(me.house&&SS.done){
    var h=HOUSE[me.house];
    app.innerHTML='<h1>หมวกคัดสรรตัดสินแล้ว!</h1><div class="card" style="text-align:center"><div style="font-size:3.5rem">'+h[1]+'</div><div class="nm">'+h[0]+'</div>'+HD[me.house]+'</div><button class="green" id="ok">เข้าสู่ฮอกวอตส์</button>';
    $("ok").onclick=function(){SS=null;go("hub")};return;
  }
  var q=SQ[SS.i];
  app.innerHTML='<h1>🎩 หมวกคัดสรร</h1><small>ข้อ '+(SS.i+1)+' จาก '+SQ.length+'</small><h2>'+q[0]+'</h2><div id="os"></div>';
  shuffle(q[1]).forEach(function(a){var b=document.createElement("button");b.className="opt";b.textContent=a[0];
    b.onclick=function(){SS.sc[a[1]]++;SS.i++;
      if(SS.i<SQ.length)rSort();
      else{me.house=Object.keys(SS.sc).sort(function(a,b){return SS.sc[b]-SS.sc[a]||Math.random()-.5})[0];SS.done=true;save();rSort()}};
    $("os").appendChild(b)});
}
var UN;
var UC={R:"#c0392b",Y:"#d9a21b",G:"#2ca84a",B:"#3f7de0",W:"linear-gradient(135deg,#c0392b,#e8b44a,#2ca84a,#3f7de0)"},CN={R:"แดง",Y:"เหลือง",G:"เขียว",B:"น้ำเงิน"};
function newU(){
  var d=[];
  ["R","Y","G","B"].forEach(function(c){d.push({c:c,v:"0"});
    for(var i=1;i<=9;i++)d.push({c:c,v:""+i},{c:c,v:""+i});
    ["⛔","🔄","+2"].forEach(function(v){d.push({c:c,v:v},{c:c,v:v})})});
  for(var i=0;i<4;i++)d.push({c:"W",v:"🌈"},{c:"W",v:"+4"});
  d=shuffle(d);
  while(!/^\d$/.test(d[d.length-1].v))d.unshift(d.pop());
  var top=d.pop();
  UN={deck:d,disc:[top],top:top,col:top.c,hand:[],bot:[],turn:"p",msg:"",over:null,pick:null,drew:false};
  udraw(UN.hand,7);udraw(UN.bot,7);
}
function udraw(h,n){
  for(var i=0;i<n;i++){
    if(!UN.deck.length){var t=UN.disc.pop();UN.deck=shuffle(UN.disc);UN.disc=[t]}
    if(!UN.deck.length)break;
    h.push(UN.deck.pop());
  }
}
function ucan(c){return c.c==="W"||c.c===UN.col||c.v===UN.top.v}
function udo(who,idx,col){
  var hand=who==="p"?UN.hand:UN.bot,oth=who==="p"?UN.bot:UN.hand,otherId=who==="p"?"b":"p";
  var c=hand.splice(idx,1)[0],again=false;
  UN.disc.push(c);UN.top=c;UN.col=c.c==="W"?col:c.c;UN.pick=null;
  var nm=who==="p"?"คุณ":"บอท";
  UN.msg=nm+"ลง "+c.v+(c.c==="W"?" เลือกสี"+CN[col]:"");
  if(c.v==="+2"){udraw(oth,2);again=true;UN.msg+=" อีกฝ่ายจั่ว 2 ใบและโดนข้าม"}
  else if(c.v==="+4"){udraw(oth,4);again=true;UN.msg+=" อีกฝ่ายจั่ว 4 ใบและโดนข้าม"}
  else if(c.v==="⛔"||c.v==="🔄"){again=true;UN.msg+=" อีกฝ่ายโดนข้าม"}
  if(!hand.length){
    UN.over=who;
    if(who==="p"){me.xp+=40;me.gal+=30;me.uno=(me.uno||0)+1;moAdd("uno",1);save()}
    rUno();return;
  }
  UN.drew=false;UN.turn=again?who:otherId;
  rUno();
  if(UN.turn==="b")setTimeout(ubot,1000);
}
function ubot(){
  if(!UN||UN.over||view!=="uno"||UN.turn!=="b")return;
  var i=-1,w=-1;
  UN.bot.forEach(function(c,k){if(ucan(c)){if(c.c==="W"){if(w<0)w=k}else if(i<0)i=k}});
  if(i<0)i=w;
  if(i<0){
    udraw(UN.bot,1);var c=UN.bot[UN.bot.length-1];
    if(c&&ucan(c))i=UN.bot.length-1;
    else{UN.msg="บอทจั่วไพ่และผ่าน";UN.turn="p";rUno();return}
  }
  var cnt={R:0,Y:0,G:0,B:0};UN.bot.forEach(function(c,k){if(k!==i&&c.c!=="W")cnt[c.c]++});
  var col=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0];
  udo("b",i,col);
}
function updraw(){
  if(UN.turn!=="p"||UN.over||UN.drew||UN.pick!==null)return;
  udraw(UN.hand,1);var c=UN.hand[UN.hand.length-1];
  if(c&&ucan(c)){UN.drew=true;UN.msg="จั่วได้ไพ่ที่ลงได้ ลงเลยหรือกดผ่าน"}
  else{UN.msg="จั่วแล้วลงไม่ได้ ถึงตาบอท";UN.turn="b";setTimeout(ubot,1000)}
  rUno();
}
function upass(){if(UN.turn!=="p"||!UN.drew)return;UN.drew=false;UN.turn="b";UN.msg="คุณผ่าน";rUno();setTimeout(ubot,1000)}
function upick(i){
  if(UN.turn!=="p"||UN.over)return;
  var c=UN.hand[i];
  if(!ucan(c)){UN.msg="ไพ่ใบนี้ลงไม่ได้ ต้องสีหรือเลขเดียวกัน";rUno();return}
  if(c.c==="W"){UN.pick=i;rUno();return}
  udo("p",i);

    var d=sn.data(),o=null;try{o=JSON.parse(d.data)}catch(e){}
    if(!o||!o.name){netBootMsg();return}
    var k=nkey(o.name),l=DB.u[k];
    if(l&&l.uid===u.uid){if((l._t||0)>(d.t||0))o=l;else o.pw=l.pw}
    netEnter(k,o,u.uid);afterLogin(k);save();
    if(view==="login")go(next());
    netAfterEnter()
  }).catch(function(){NET.bt=0;netBootMsg()})}
function netLogout(cb){
  var f=function(){try{if(NET.F)NET.F.A.signOut(NET.F.auth)}catch(e){}
    NET.uid=null;NET.list=[];NET.pl={};NET.lt=0;HSNAP=null;cb()};
  if(NET.uid&&me){var d=0,g=function(){if(!d){d=1;f()}};netPush().then(g,g);setTimeout(g,2500)}else f()}
/* ---- push my data ---- */
function netPub(){return{name:me.name,k:nkey(me.name),house:me.house||null,av:me.av||null,xp:me.xp||0,lvl:lvl(me),likes:me.likes||0,hp:me.hp||0,wk:me.wk||"",wp:me.wp||0,lwk:me.lwk||"",lwp:me.lwp||0,t:me._t||Date.now()}}
function netPush(){
  NET.pt=null;
  if(!NET.uid||!me)return Promise.resolve(false);
  var S=NET.F.S,o=JSON.parse(JSON.stringify(me)),pub;delete o.pw;o.uid=NET.uid;
  pub=netPub();pub.data=JSON.stringify(o);
  return S.setDoc(S.doc(NET.F.db,"players",NET.uid),pub).then(function(){NET.perr=0;return true},function(){NET.perr=1;return false})}
function netSched(){if(NET.uid&&me&&!NET.pt)NET.pt=setTimeout(netPush,4000)}
function netHp(){
  if(!me||!me.house||!HSNAP)return;
  var k=me.house,d=DB.h[k]-HSNAP[k];if(d>0)me.hp=(me.hp||0)+d;HSNAP[k]=DB.h[k]}
document.addEventListener("visibilitychange",function(){if(document.hidden&&NET.uid&&NET.pt)netPush()});
window.addEventListener("pagehide",function(){if(NET.uid&&NET.pt)netPush()});
/* ---- gifts ---- */
function applyGift(o,g,fr){
  o.inbox=o.inbox||[];var s=null;
  if(g.type==="like"){o.likes=(o.likes||0)+1;o.gal=(o.gal||0)+5;s="❤️ กดไลก์บ้านของคุณ"}
  else if(g.type==="gal"){var v=Math.min(1000,Math.max(0,Math.floor(+g.amt||0)));if(!v)return false;o.gal=(o.gal||0)+v;s="💰 "+fmt(v)+" แกลเลียน"}
  else if(g.type==="dec"){var id=String(g.id||""),it=id.indexOf("d:")===0?decItem(id):null;if(!it)return false;o.dec=o.dec||[];if(o.dec.indexOf(id)<0)o.dec.push(id);else o.gal=(o.gal||0)+Math.floor(it.p/2);s=it.e+" "+it.n}
  else return false;
  o.inbox.push({f:fr,s:s});if(o.inbox.length>30)o.inbox.shift();return true}
function netGift(to,g){
  if(!NET.uid||!me)return Promise.resolve(false);
  var S=NET.F.S;
  return S.addDoc(S.collection(NET.F.db,"gifts"),{from:NET.uid,fromName:me.name,to:to,type:g.type,amt:g.amt||0,id:g.id||"",t:Date.now()}).then(function(){return true},function(){return false})}
function netPull(){
  if(!NET.uid||!me||NET.pulling)return Promise.resolve(0);
  NET.pulling=1;var S=NET.F.S;
  return S.getDocs(S.query(S.collection(NET.F.db,"gifts"),S.where("to","==",NET.uid),S.limit(50))).then(function(qs){
    var n=0,dels=[];me.gids=me.gids||[];
    qs.forEach(function(d){
      var g=d.data(),id=d.id;
      if(me.gids.indexOf(id)<0){if(applyGift(me,g,String(g.fromName||"เพื่อน").replace(/[<>"'`&]/g,"").slice(0,24)))n++;me.gids.push(id)}
      dels.push(S.deleteDoc(d.ref).catch(function(){}))});
    if(me.gids.length>200)me.gids=me.gids.slice(-200);
    if(n){save();if(view==="hub"&&HT==="home")render()}
    return Promise.all(dels).then(function(){NET.pulling=0;return n})
  }).catch(function(){NET.pulling=0;return 0})}
/* ---- players list + shared house points / weekly cup ---- */
function netParse(x,raw){
  var o=null;try{o=JSON.parse(raw)}catch(e){}
  if(!o||typeof o!=="object")o={name:x.name,house:x.house,av:x.av,xp:x.xp||0,own:[],dec:[]};
  o=nclean(o,0);o.xp=+o.xp||0;o.gal=+o.gal||0;o.likes=+o.likes||0;if(!Array.isArray(o.own))o.own=[];return o}
function netPlayers(cb,force){
  if(!NET.uid){if(cb)cb();return}
  if(NET.busy){NET.wait=NET.wait||[];if(cb)NET.wait.push(cb);return}
  if(!force&&Date.now()-NET.lt<30000){if(cb)cb();return}
  NET.busy=1;var S=NET.F.S;
  S.getDocs(S.query(S.collection(NET.F.db,"players"),S.orderBy("xp","desc"),S.limit(200))).then(function(qs){
    var L=[],P={};
    qs.forEach(function(d){var x=d.data(),raw=x.data;delete x.data;x=nclean(x,0);x.uid=d.id;L.push(x);P[d.id]=netParse(x,raw)});
    NET.list=L;NET.pl=P;NET.lerr=0;netAgg()
  }).catch(function(){NET.lerr=1}).then(function(){
    NET.busy=0;NET.lt=Date.now();var w=NET.wait||[];NET.wait=[];if(cb)cb();w.forEach(function(f){f()})})}
function pkey(){var d=new Date(),t=new Date(d.getFullYear(),d.getMonth(),d.getDate());t.setDate(t.getDate()-((t.getDay()+6)%7)-7);return dk(t)}
function netAgg(){
  if(me)netHp();
  var wk=weekKey(),pk=pkey(),H={G:0,S:0,H:0,R:0},W={G:0,S:0,H:0,R:0},L={G:0,S:0,H:0,R:0},arr=NET.list.filter(function(e){return e.uid!==NET.uid});
  if(me&&me.house)arr.push(netPub());
  arr.forEach(function(p){
    if(!p.house||!(p.house in H))return;
    H[p.house]+=+p.hp||0;
    if(p.wk===wk)W[p.house]+=+p.wp||0;
    L[p.house]+=p.wk===pk?(+p.wp||0):(p.lwk===pk?(+p.lwp||0):0)});
  H.G=999999999999999;DB.h=H;
  var best=null,bv=0;["G","S","H","R"].forEach(function(h){if(L[h]>bv){bv=L[h];best=h}});
  DB.w={k:wk,p:W,last:best?{k:pk,win:best,p:L}:undefined};
  HSNAP={G:H.G,S:H.S,H:H.H,R:H.R}}
function topList(){
  if(!NET.uid)return Object.keys(DB.u).map(function(k){return DB.u[k]}).filter(function(p){return p.house}).sort(function(a,b){return b.xp-a.xp}).slice(0,10);
  if(Date.now()-NET.lt>30000&&!NET.busy)netPlayers(function(){if(view==="hub"&&HT==="top")render()});
  return NET.list.filter(function(p){return p.house}).sort(function(a,b){return b.xp-a.xp}).slice(0,10)}
function netBadge(){return'<div style="text-align:center;font-size:.78rem;margin:2px 0 6px;color:'+(NET.uid?"#7ee787":"#ffb454")+'">'+(NET.uid?'☁️ เชื่อมต่อเซิร์ฟเวอร์แล้ว • บันทึกอัตโนมัติ'+(NET.perr?' <span style="color:#ff8a80">⚠️ ซิงค์ไม่สำเร็จ จะลองใหม่</span>':''):'📴 โหมดออฟไลน์ • ข้อมูลอยู่ในเครื่องนี้เท่านั้น')+'</div>'}
function pOf(k){return NET.uid?NET.pl[k]:DB.u[k]}
function others(){
  if(NET.uid)return NET.list.filter(function(e){return e.uid!==NET.uid&&e.house&&e.av}).map(function(e){return e.uid});
  return Object.keys(DB.u).filter(function(k){var p=DB.u[k];return p!==me&&p.house&&p.av})}
/* ---- change password ---- */
function pwDo(old,nw,cb){
  if(!NET.uid){if(me.pw!==hash(old))return cb("รหัสผ่านเดิมไม่ถูกต้อง");me.pw=hash(nw);save();return cb("");}
  var F=NET.F,A=F.A,email=nmail(nkey(me.name));
  A.signInWithEmailAndPassword(F.auth,email,"hq|"+old).then(function(c){return A.updatePassword(c.user,"hq|"+nw)}).then(function(){me.pw=hash(nw);save();cb("")},function(e){
    var k=e&&e.code||"";cb(/invalid-credential|wrong-password|invalid-login/.test(k)?"รหัสผ่านเดิมไม่ถูกต้อง":netErr(e))})}
function pwModal(){
  if($("pwm"))return;
  var d=document.createElement("div");d.id="pwm";d.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.75);z-index:99;display:flex;align-items:center;justify-content:center;padding:16px";
  d.innerHTML='<div class="card" style="max-width:340px;width:100%;background:#1c1f2e"><b>🔑 เปลี่ยนรหัสผ่าน</b><input id="pw0" type="password" placeholder="รหัสผ่านเดิม"><input id="pw1" type="password" placeholder="รหัสผ่านใหม่ (อย่างน้อย 4 ตัว)"><input id="pw2" type="password" placeholder="ยืนยันรหัสผ่านใหม่"><div class="msg" id="pwmsg"></div><button class="green" id="pwok">บันทึก</button><button class="grey" id="pwno">ยกเลิก</button></div>';
  document.body.appendChild(d);
  var m=$("pwmsg"),busy=0;
  $("pwno").onclick=function(){d.remove()};
  $("pwok").onclick=function(){
    if(busy)return;var o=$("pw0").value,n=$("pw1").value;
    if(!o){m.textContent="กรอกรหัสผ่านเดิม";return}
    if(n.length<4){m.textContent="รหัสผ่านใหม่ต้องมีอย่างน้อย 4 ตัว";return}
    if(n!==$("pw2").value){m.textContent="รหัสผ่านใหม่ทั้งสองช่องไม่ตรงกัน";return}
    if(n===o){m.textContent="รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม";return}
    busy=1;m.textContent="⏳ กำลังบันทึก...";
    pwDo(o,n,function(err){busy=0;if(err){m.textContent=err;return}
      m.style.color="#7ee787";m.textContent="✅ เปลี่ยนรหัสผ่านเรียบร้อยแล้ว";$("pwok").style.display="none";$("pwno").textContent="ปิด"})}}
function plusHome(){return netBadge()+plusHome0()}
load();render();$("mus").onclick=toggleMusic;musUpd();netBoot();
</script>
